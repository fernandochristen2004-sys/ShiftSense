services:
  db:
    image: postgres:18
    container_name: shiftsense-db
    environment:
      POSTGRES_USER: shiftsense
      POSTGRES_PASSWORD: shiftsense_dev
      POSTGRES_DB: shiftsense
    ports:
      - "5432:5432"
    volumes:
      - shiftsense-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftsense -d shiftsense"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  shiftsense-data: